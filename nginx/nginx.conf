server {
    listen 80;
    server_name _;

    # Лимит на размер тела запроса. Backend разрешает до 500 МБ
    # (competition_zip_max_bytes), но nginx по умолчанию режет на 1 МБ —
    # без этой строки ZIP-загрузки больше 1 МБ падают с 413.
    client_max_body_size 512m;

    # API платформы: /api/... -> backend:8000/...
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;

        # WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Таймауты для больших загрузок — иначе nginx оборвёт медленный upload.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;

        # WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}