server {
    listen 80;
    server_name _;

    # Лимит на размер тела запроса. Backend разрешает до 500 МБ
    # (competition_zip_max_bytes), но nginx по умолчанию режет на 1 МБ.
    client_max_body_size 512m;

    # ═══════════════════════════════════════════════════════════════
    # Auth-service (путь /api/v1/*)
    #
    # Роутеры auth-service живут с префиксом /api/v1, поэтому
    # proxy_pass с завершающим / СОХРАНЯЕТ префикс как есть.
    # ═══════════════════════════════════════════════════════════════
    location /api/v1/ {
        proxy_pass http://auth-service:8000/api/v1/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ═══════════════════════════════════════════════════════════════
    # CTF-platform backend (путь /api/*)
    #
    # proxy_pass со слэшем срезает префикс /api:
    #   /api/challenges → http://backend:8000/challenges
    # ═══════════════════════════════════════════════════════════════
    location /api/ {
        proxy_pass http://backend:8000/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_x_forwarded_host;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ═══════════════════════════════════════════════════════════════
    # Frontend (React SPA, собранный Vite и раздаваемый nginx:alpine
    # внутри сервиса frontend).
    #
    # ЕДИНСТВЕННЫЙ блок location / в этом файле. Если добавишь второй —
    # nginx упадёт с "duplicate location /".
    # ═══════════════════════════════════════════════════════════════
    location / {
        proxy_pass http://frontend:80;

        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}