# Замените ./nginx/nginx.conf в корне ctf-platform на этот файл, когда
# добавите сервис frontend в docker-compose.yml (см. docker-compose.patch.yml
# в этой же папке).

server {
    listen 80;
    server_name _;

    # API платформы: /api/auth/..., /api/challenges/..., /api/admin/...
    # proxy_pass с завершающим "/" срезает префикс /api при проксировании,
    # так что бэкенд по-прежнему видит /auth/..., /challenges/..., /admin/...
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Статическая сборка фронтенда (React SPA)
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
