server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Хешированная статика Vite ──────────────────────────────────────
    #
    # Vite кладёт в /assets/ файлы с контентным хешем в имени
    # (main-a1b2c3d4.js, index-9f8e7d6c.css). Имя меняется при каждом
    # изменении содержимого → можно кэшировать на год с immutable.
    #
    # `immutable` — подсказка браузеру не делать revalidation по F5
    # в течение срока действия max-age. Экономит round-trip'ы.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── index.html ─────────────────────────────────────────────────────
    #
    # Не кэшируем: после деплоя новой сборки index.html ссылается на
    # ДРУГИЕ хеши assets. Если браузер закэширует старый index.html,
    # пользователь после F5 получит ссылки на файлы, которых уже нет.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── SPA-fallback ───────────────────────────────────────────────────
    #
    # Ключевой блок. React Router работает на клиенте: URL
    # /competitions/spring-2026 существует только в JS, физического
    # файла под него нет. Без try_files ... /index.html nginx вернёт
    # 404 при F5 и при открытии прямой ссылки.
    location / {
        try_files $uri $uri/ /index.html;
    }
}