<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SecureNotes — Мои заметки</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand">
      <span class="logo">📝</span>
      <span class="brand-name">SecureNotes</span>
    </div>
    <nav>
      <span class="nav-user">{{ username }} ({{ role }})</span>
      <a href="/logout">Выйти</a>
    </nav>
  </header>

  <main class="container">
    <div class="dashboard">
      <section class="card note-form">
        <h2>Новая заметка</h2>
        <form id="noteForm">
          <div class="field">
            <textarea id="noteText" rows="3" placeholder="Ваша заметка..." required></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Сохранить</button>
        </form>
      </section>

      <section class="card">
        <div class="section-head">
          <h2>Мои заметки</h2>
          <button id="adminBtn" class="btn btn-secondary" title="Только для администраторов">🔑 Флаг администратора</button>
        </div>
        <div id="notesList" class="note-list">
          <p class="muted">Загрузка…</p>
        </div>
      </section>
    </div>

    <div id="error" class="alert hidden"></div>
    <div id="flagBox" class="card hidden">
      <pre id="flagOutput"></pre>
    </div>
  </main>

  <footer class="site-footer">
    <p>© 2024 SecureNotes Inc.</p>
  </footer>
  <script src="/static/notes.js"></script>
</body>
</html>
