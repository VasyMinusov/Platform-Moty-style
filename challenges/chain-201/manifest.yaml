title: "Chain Reaction: IDOR → SSRF → RCE"
category: "web"
difficulty: "hard"
points: 400
description: >
  Комплексное задание из нескольких связанных шагов: зарегистрируйтесь,
  найдите способ получить доступ к чужому профилю, используйте
  полученные данные, чтобы заставить внутренний сервис сходить туда,
  куда вы сами напрямую попасть не можете, и добейтесь выполнения
  произвольной команды на этом внутреннем сервисе. Флаг лежит вне
  директории приложения — обычным способом до него не добраться.
flag: "flag{chain_re4ction_idor_ssrf_rce}"
