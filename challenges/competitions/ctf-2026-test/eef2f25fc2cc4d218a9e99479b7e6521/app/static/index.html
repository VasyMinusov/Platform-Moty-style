<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Secure Keypad</title>
<style>
  :root {
    --bg: #0a0c10;
    --panel: #141820;
    --panel-2: #1c212c;
    --border: #262d3a;
    --text: #e6ecf4;
    --muted: #8892a6;
    --faint: #57607a;
    --accent: #7c9fff;
    --accent-soft: rgba(124, 159, 255, 0.14);
    --success: #4ade80;
    --danger: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 50% 0%, rgba(124, 159, 255, 0.06), transparent 40%),
      var(--bg);
    color: var(--text);
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 24px 24px;
    box-shadow: 0 24px 60px -30px rgba(0, 0, 0, 0.8);
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .sub {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 22px;
  }
  .display {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin: 0 0 20px;
  }
  .slot {
    width: 44px;
    height: 56px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--panel-2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 24px;
    color: var(--text);
    transition: border-color 0.15s, background 0.15s;
  }
  .slot.filled { border-color: var(--accent); }
  .slot.ok    { border-color: var(--success); color: var(--success); }
  .slot.err   { border-color: var(--danger);  color: var(--danger);  }
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }
  .key {
    font-family: inherit;
    font-size: 20px;
    font-weight: 500;
    height: 54px;
    background: var(--panel-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, transform 0.05s;
  }
  .key:hover:not(:disabled) { border-color: var(--accent); }
  .key:active:not(:disabled) { transform: translateY(1px); }
  .key:disabled { opacity: 0.5; cursor: not-allowed; }
  .key.wide { grid-column: span 1; }
  .key.ghost {
    background: transparent;
    color: var(--muted);
    font-size: 14px;
  }
  .status {
    padding: 12px 14px;
    border-radius: 8px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 14px;
    min-height: 20px;
  }
  .status.ok  { color: var(--success); border-color: rgba(74, 222, 128, 0.4); }
  .status.err { color: var(--danger);  border-color: rgba(248, 113, 113, 0.4); }
  .meta {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--faint);
    font-family: ui-monospace, Menlo, monospace;
    margin-top: 12px;
  }
  .meta .val { color: var(--accent); }
  .history {
    margin-top: 14px;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 11px;
    color: var(--faint);
    max-height: 96px;
    overflow-y: auto;
    background: #08090d;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .history .r-ok   { color: var(--success); }
  .history .r-err  { color: var(--danger);  }
  .history .ts     { color: #4a505c; }
  .history .ms     { color: var(--accent); }
  .foot {
    text-align: center;
    margin-top: 14px;
    font-size: 11px;
    color: #404550;
    font-family: ui-monospace, Menlo, monospace;
  }
</style>
</head>
<body>
<div class="card">
  <h1>Secure Keypad</h1>
  <p class="sub">Enter the 6-digit PIN. Unlimited attempts.</p>

  <div class="display" id="display">
    <div class="slot"></div>
    <div class="slot"></div>
    <div class="slot"></div>
    <div class="slot"></div>
    <div class="slot"></div>
    <div class="slot"></div>
  </div>

  <div class="keypad" id="keypad">
    <button class="key" data-d="1">1</button>
    <button class="key" data-d="2">2</button>
    <button class="key" data-d="3">3</button>
    <button class="key" data-d="4">4</button>
    <button class="key" data-d="5">5</button>
    <button class="key" data-d="6">6</button>
    <button class="key" data-d="7">7</button>
    <button class="key" data-d="8">8</button>
    <button class="key" data-d="9">9</button>
    <button class="key ghost" id="btn-clear">clear</button>
    <button class="key" data-d="0">0</button>
    <button class="key ghost" id="btn-enter">enter</button>
  </div>

  <div class="status" id="status">Enter the PIN.</div>

  <div class="meta">
    <span>attempts: <span class="val" id="attempts">0</span></span>
    <span>last: <span class="val" id="last-time">—</span></span>
  </div>

  <div class="history" id="history"></div>

  <div class="foot">secure-keypad v0.9</div>
</div>

<script>
const state = {
  pin: '',
  attempts: 0,
  locked: false,
};

const elSlots = document.querySelectorAll('.slot');
const elStatus = document.getElementById('status');
const elAttempts = document.getElementById('attempts');
const elLastTime = document.getElementById('last-time');
const elHistory = document.getElementById('history');

function render() {
  elSlots.forEach((s, i) => {
    s.textContent = state.pin[i] || '';
    s.className = 'slot' + (state.pin[i] ? ' filled' : '');
  });
  elAttempts.textContent = state.attempts;
}

function pushHistory(ok, pin, ms) {
  const ts = new Date().toTimeString().slice(0, 8);
  const el = document.createElement('div');
  el.innerHTML = `<span class="ts">[${ts}]</span> ` +
                 `<span class="${ok ? 'r-ok' : 'r-err'}">${ok ? 'OK ' : 'ERR'}</span> ` +
                 `<span>${pin}</span> ` +
                 `<span class="ms">${ms} ms</span>`;
  elHistory.appendChild(el);
  elHistory.scrollTop = elHistory.scrollHeight;
}

function setStatus(cls, msg) {
  elStatus.className = 'status ' + cls;
  elStatus.textContent = msg;
}

function pressDigit(d) {
  if (state.locked) return;
  if (state.pin.length >= 6) return;
  state.pin += d;
  render();
  if (state.pin.length === 6) submit();
}

function clearPin() {
  if (state.locked) return;
  state.pin = '';
  render();
  setStatus('', 'Enter the PIN.');
}

async function submit() {
  if (state.locked) return;
  state.locked = true;
  const submitted = state.pin;
  const t0 = performance.now();
  try {
    const r = await fetch('/api/check', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: submitted }),
    });
    const data = await r.json();
    const dt = Math.round(performance.now() - t0);
    state.attempts = data.attempts_total ?? (state.attempts + 1);

    if (data.ok) {
      elSlots.forEach(s => s.classList.add('ok'));
      setStatus('ok', 'Access granted. ' + data.flag);
      pushHistory(true, submitted, dt);
      elLastTime.textContent = dt + ' ms';
      return;
    }

    elSlots.forEach(s => s.classList.add('err'));
    setStatus('err', data.message || 'Wrong PIN.');
    pushHistory(false, submitted, dt);
    elLastTime.textContent = dt + ' ms';
  } catch (e) {
    setStatus('err', 'Network error');
  } finally {
    setTimeout(() => {
      state.pin = '';
      state.locked = false;
      render();
    }, 400);
  }
}

document.querySelectorAll('.key[data-d]').forEach(btn => {
  btn.addEventListener('click', () => pressDigit(btn.dataset.d));
});
document.getElementById('btn-clear').addEventListener('click', clearPin);
document.getElementById('btn-enter').addEventListener('click', () => {
  if (state.pin.length === 6) submit();
});

// keyboard support
document.addEventListener('keydown', e => {
  if (e.key >= '0' && e.key <= '9') pressDigit(e.key);
  else if (e.key === 'Enter' && state.pin.length === 6) submit();
  else if (e.key === 'Backspace') {
    state.pin = state.pin.slice(0, -1); render();
  } else if (e.key === 'Escape') clearPin();
});

render();
</script>
</body>
</html>
