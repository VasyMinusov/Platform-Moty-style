services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ctf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ctf_password_change_me}
      POSTGRES_DB: ctf
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - platform_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctf -d ctf"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s

  backend:
    build: ./backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    environment:
      DATABASE_URL: postgresql+psycopg2://ctf:${POSTGRES_PASSWORD:-ctf_password_change_me}@db:5432/ctf
      # Секреты и учётки — из .env (генерируются lan-setup.sh).
      JWT_SECRET: ${JWT_SECRET:-change_me_super_secret}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-VasyMinusov}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-0907Seva!!!2003}
      MODERATOR_USERNAME: ${MODERATOR_USERNAME:-moderator}
      MODERATOR_PASSWORD: ${MODERATOR_PASSWORD:-moderato123}
      CHALLENGE_PORT_RANGE_START: "30000"
      CHALLENGE_PORT_RANGE_END: "30199"
      CHALLENGES_DIR: /challenges
      INSTANCE_TTL_SECONDS: "2700"
      DOCKER_NETWORK: "ctf-platform_isolated_net"
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    # ВАЖНО: порт 8000 наружу НЕ публикуется. Backend доступен только
    # по platform_net через nginx (/api/). Это убирает возможность
    # кому-либо в LAN бить по API напрямую.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./challenges:/challenges:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      # backend больше НЕ в isolated_net: управление контейнерами идёт
      # через Docker socket, сетевая связность с заданиями не нужна.
      # Это убирает возможность заданиям из isolated_net обращаться
      # к backend и БД.
      - platform_net

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - platform_net

networks:
  platform_net:
    driver: bridge
  isolated_net:
    driver: bridge
    # Если заданиям НЕ нужен исходящий доступ (в т.ч. reverse shell в
    # metasploit-201, ssrf-201 в интернет, chain-201 наружу) —
    # раскомментируйте:
    # internal: true

volumes:
  db_data: