# ═══════════════════════════════════════════════════════════════════════════
# Alembic configuration
#
# ВАЖНО: sqlalchemy.url НЕ задаётся здесь. Он читается из app.config.Settings
# в migrations/env.py. Это позволяет иметь единый источник конфигурации
# (.env через pydantic-settings) вместо дублирования.
# ═══════════════════════════════════════════════════════════════════════════

[alembic]
# Путь до скриптов миграций
script_location = migrations

# Префикс для файлов миграций. timestamp — сортировка по времени создания.
# Пример: 2025_09_24_2344_initial_schema.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Часовой пояс для timestamp в имени файла
timezone = UTC

# Путь до шаблона миграций (script.py.mako)
# По умолчанию — migrations/script.py.mako
# prepend_sys_path нужен, чтобы Alembic видел пакет `app` при импорте моделей
prepend_sys_path = .

# sqlalchemy.url — НЕ задаём здесь, читается из Settings.
# Если нужно переопределить (например, для offline-режима) — раскомментируй:
# sqlalchemy.url = postgresql+asyncpg://user:pass@localhost:5432/dbname

# Включать ли "version_path_separator" для нескольких директорий миграций.
# Не нужно при одном каталоге.
# version_path_separator = os


# ═══════════════════════════════════════════════════════════════════════════
# Logging (используется Alembic'ом, structlog не задействован)
# ═══════════════════════════════════════════════════════════════════════════

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S